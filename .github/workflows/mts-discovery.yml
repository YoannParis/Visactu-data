name: Tester la source italienne MTS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mts-discovery.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test public MTS data from collector
        run: |
          python - <<'PY'
          import urllib.request, re, json
          from html import unescape
          url = 'https://www.mtsmarkets.com/'
          print('URL', url, flush=True)
          try:
              req = urllib.request.Request(url, headers={'User-Agent': 'Visactu-official-yields/1.0', 'Accept': 'text/html'})
              with urllib.request.urlopen(req, timeout=35) as response:
                  body = response.read(5_000_000).decode()
                  print('HTTP', response.status, 'bytes', len(body), flush=True)
              plain = unescape(re.sub('<[^>]+>', ' ', body))
              plain = re.sub(r'\s+', ' ', plain)
              for pattern in ['European Bond Yields', 'Time snapshot', 'Italy']:
                  for m in list(re.finditer(pattern, plain, re.I))[:4]:
                      print('TEXT', plain[max(0,m.start()-100):m.end()+650], flush=True)
              print('SCRIPTS', json.dumps(re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)', body)), flush=True)
              links = re.findall(r'href=["\x27]([^"\x27]+)', body)
              print('DATA_LINKS', json.dumps(sorted(set(x for x in links if re.search('data|histor|yield|disclaim', x, re.I)))), flush=True)
              for m in list(re.finditer(r'Italy', body))[:4]:
                  print('HTML', body[max(0,m.start()-700):m.end()+1400], flush=True)
              for m in list(re.finditer(r'drupalSettings|__NEXT_DATA__',body))[:3]:
                  print('SETTINGS', body[max(0,m.start()-100):m.end()+14000],flush=True)
          except Exception as exc:
              print('ERROR', type(exc).__name__, str(exc), flush=True)
          PY
