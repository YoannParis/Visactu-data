name: Vérifier l'accès BPstat depuis la collecte
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/bpstat-discovery.yml']
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public BPstat metadata
        run: |
          python - <<'PY'
          import json, urllib.request
          urls = [
              'https://bpstat.bportugal.pt/data/v1/domains/26/datasets/690b7b36fd36c0dbe249c48cbbc39524?lang=EN&obs_since=2026-10-01',
          ]
          for url in urls:
              print('URL', url, flush=True)
              try:
                  req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Visactu-official-yields/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = json.load(response)
                      print('HTTP', response.status, flush=True)
                  print(json.dumps(body, ensure_ascii=False)[:120000], flush=True)
              except Exception as exc:
                  print(type(exc).__name__, str(exc), flush=True)
          PY
